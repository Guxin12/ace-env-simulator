name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK（Android 项目需要 Java 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. 上传 APK 作为可下载的 Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ace-env-simulator-debug-apk   # 产物名称（可自定义）
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30                  # 产物保留 30 天（可选）
